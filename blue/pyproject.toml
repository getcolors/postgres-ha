[project]
name = "package-postgres-ha-blue"
version = "0.1.0"
description = "Blue/Python implementation of the postgres-ha package"
requires-python = ">=3.11"
dependencies = [
    "blue",
    "colors-compute-blue @ git+https://github.com/getcolors/colors-compute.git@85bf076dfe2c34025dc9362f1cc4c5bc92a4373d#subdirectory=blue",
    "package-once-blue",
]

[tool.uv.sources]
package-once-blue = { git = "https://github.com/getcolors/once.git", subdirectory = "blue", rev = "10e525ae7c37130ab4d532b91c8d2ead94557cc8" }
blue = { git = "https://github.com/getcolors/blue.git", rev = "290f313ead5ca162875c33a049c880da017eae09" }
colors-compute-blue = { git = "https://github.com/getcolors/colors-compute.git", subdirectory = "blue", rev = "85bf076dfe2c34025dc9362f1cc4c5bc92a4373d" }

# Keep the package SDK pin authoritative across dependencies.
[tool.uv]
override-dependencies = [
    "blue @ git+https://github.com/getcolors/blue.git@290f313ead5ca162875c33a049c880da017eae09",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_postgres_ha_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
