---
# The `~/.ssh/config` block, per the workspace SSH Config Standard.
#
# One managed block carries every alias this deployment owns: the bare profile,
# which reaches node 0 and is what the standard promises an operator can type,
# and one alias per node, because `status --node N`, `failover` and the
# acceptance checks each reach one specific member of the cluster. The
# addresses arrive as extra-vars — they are run-time facts, and keeping them
# out of the rendered playbook is what makes the committed goldens identical on
# every workstation (§6). `block_state` is `present` on create and `absent` on
# delete; the same playbook file serves both events.
- name: Manage local access to the postgres-ha-fixture cluster
  hosts: local
  gather_facts: false
  tasks:
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"
      when: block_state == "present"

    # ssh-config.md §8: a marker change is a migration, not a rename. Before
    # this package adopted the standard it wrote one block per node under a
    # package-prefixed marker; a converge that only wrote the new block would
    # leave those in place, stale, below it. Removed here on both events for
    # one pin cycle; then this task goes. `create` only makes the parent
    # directory: a missing file is "not present", never created.
    - name: Remove the pre-standard per-node blocks
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} postgres-ha {{ item }} ANSIBLE MANAGED BLOCK"
        state: absent
      loop: "{{ legacy_aliases }}"

    - name: Write the managed block
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} {{ host_alias }} ANSIBLE MANAGED BLOCK"
        insertbefore: BOF
        state: "{{ block_state }}"
        block: |
          {% for host in ssh_hosts %}
          Host {{ host.name }}
              HostName {{ host.ip }}
              User root
              Port 22
              IdentityFile {{ ssh_private_key }}
              StrictHostKeyChecking accept-new
              ForwardAgent no
          {% endfor %}
