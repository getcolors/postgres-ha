[defaults]
interpreter_python = auto_silent
inventory = inventory.json
force_color = True
gathering = smart
stdout_callback = default
display_skipped_hosts = False
# The three nodes are configured identically and must move together; a
# converge that half-succeeded is a cluster nobody can reason about.
any_errors_fatal = True
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
